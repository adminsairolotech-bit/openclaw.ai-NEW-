name: Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Railway
        uses: railway-action@v1
        with:
          api-key: ${{ secrets.RAILWAY_API_TOKEN }}
          project-id: ${{ secrets.RAILWAY_PROJECT_ID }}
          service-name: openclaw
        env:
          OPENCLAW_TOKEN: ${{ secrets.OPENCLAW_TOKEN }}
          OPENCLAW_LLM_PROVIDER: openai
          OPENCLAW_LLM_MODEL: gpt-4o